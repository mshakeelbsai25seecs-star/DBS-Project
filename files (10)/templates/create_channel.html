{% extends "base.html" %}
{% block title %}Create Channel - ViewTube{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <h2><i class="fa fa-tv"></i> Create a Channel</h2>
    <p style="color:var(--text-secondary);margin-bottom:1.5rem">
      Your channel is where you upload videos and build your audience.
    </p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Channel Name <span class="required">*</span></label>
        <input type="text" name="channel_name" required autofocus
               placeholder="e.g. Tech With Ali" maxlength="100">
        <small style="color:var(--text-secondary)">Must be unique across ViewTube.</small>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="4"
                  placeholder="What is your channel about?"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fa fa-check"></i> Create Channel
      </button>
      <a href="{{ url_for('profile') }}" class="btn btn-ghost btn-full" style="margin-top:.5rem">
        Cancel
      </a>
    </form>
  </div>
</div>
{% endblock %}
