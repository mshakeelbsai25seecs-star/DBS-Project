{% extends "base.html" %}
{% block title %}Create Account — ViewTube{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:480px">
    <div class="auth-logo">
      <i class="fab fa-youtube" style="color:#ff0000;font-size:2.2rem"></i>
      <h1>ViewTube</h1>
    </div>
    <h2>Create your account</h2>

    <form method="POST" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" placeholder="Ali">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" placeholder="Hassan">
        </div>
      </div>

      <div class="form-group">
        <label>Username <span class="required">*</span></label>
        <input type="text" name="username" required autofocus
               placeholder="ali_hassan123" minlength="3" maxlength="50"
               autocomplete="username">
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" name="email" required
               placeholder="ali@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="pw" name="password" required
                 placeholder="At least 6 characters" minlength="6"
                 autocomplete="new-password">
          <button type="button" class="pw-toggle" onclick="togglePw()">
            <i class="fa fa-eye" id="pw-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Country</label>
        <input type="text" name="country" placeholder="Pakistan">
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <i class="fa fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</div>

<script>
function togglePw() {
  const pw  = document.getElementById('pw');
  const eye = document.getElementById('pw-eye');
  pw.type   = pw.type === 'password' ? 'text' : 'password';
  eye.className = pw.type === 'password' ? 'fa fa-eye' : 'fa fa-eye-slash';
}
</script>
{% endblock %}
